<!DOCTYPE html>
<html lang="en">
<head>

<title>Arrow Functions</title>

<style></style>
</head>
<body>
<header class="site-header">
  <h1>Arrow Functions</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">

</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrates ES6 arrow function syntax.</p>
    <button class="btn" onclick="run()">Run</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>

<script>
const square = x => x * x;
const add = (a,b) => a + b;
function run(){ document.getElementById('output').innerHTML = `square(5) = ${square(5)}<br>add(3,4) = ${add(3,4)}`; }
</script>
</body>
