<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigator Object</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Navigator Object</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrate JavaScript Navigator object properties.</p>
<button class="btn" onclick="showNav()">Show Browser Info</button>
<div id="navOut" class="output-area"></div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function showNav(){
  document.getElementById('navOut').innerHTML =
    "App name: " + navigator.appName + "<br>" +
    "Platform: " + navigator.platform + "<br>" +
    "Language: " + navigator.language + "<br>" +
    "Online: " + navigator.onLine;
}
</script>
</body>
</html>
