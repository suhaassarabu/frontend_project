<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remove Elements Dynamically</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Remove Elements Dynamically</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Remove HTML elements from the DOM.</p>
<button class="btn" onclick="addItem()">Add Item</button>
<button class="btn" onclick="removeItem()">Remove Last</button>
<ul id="remList" class="program-list" style="margin-top:12px;"></ul>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function addItem(){
  const li = document.createElement('li');
  li.textContent = "Item " + (document.getElementById('remList').children.length + 1);
  document.getElementById('remList').appendChild(li);
}
function removeItem(){
  const list = document.getElementById('remList');
  if(list.lastElementChild) list.removeChild(list.lastElementChild);
}
</script>
</body>
</html>
