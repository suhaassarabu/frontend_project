<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dependent Dropdown (Country → State → City)</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Dependent Dropdown (Country → State → City)</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Create dependent dropdowns for Country, State, and City.</p>
<select id="country" onchange="loadStates()">
<option value="">Select Country</option>
<option value="India">India</option>
</select>
<select id="state" onchange="loadCities()"><option value="">Select State</option></select>
<select id="city"><option value="">Select City</option></select>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
const data = {
  India: {
    "Tamil Nadu": ["Chennai","Coimbatore","Madurai"],
    "Telangana": ["Hyderabad","Warangal"]
  }
};
function loadStates(){
  const country = document.getElementById('country').value;
  const stateSel = document.getElementById('state');
  stateSel.innerHTML = "<option value=''>Select State</option>";
  document.getElementById('city').innerHTML = "<option value=''>Select City</option>";
  if(data[country]){
    Object.keys(data[country]).forEach(s=>{
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      stateSel.appendChild(opt);
    });
  }
}
function loadCities(){
  const country = document.getElementById('country').value;
  const state = document.getElementById('state').value;
  const citySel = document.getElementById('city');
  citySel.innerHTML = "<option value=''>Select City</option>";
  if(data[country] && data[country][state]){
    data[country][state].forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      citySel.appendChild(opt);
    });
  }
}
</script>
</body>
</html>
