<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Show/Hide</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Password Show/Hide</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Toggle password visibility using JavaScript.</p>
<input type="password" id="pwField" placeholder="Enter password">
<button class="btn" onclick="togglePw()">Show/Hide</button>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function togglePw(){
  const field = document.getElementById('pwField');
  field.type = field.type === "password" ? "text" : "password";
}
</script>
</body>
</html>
