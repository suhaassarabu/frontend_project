<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Quiz Application</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Simple Quiz Application</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">A quiz application with scoring.</p>
    <div id="quizBox"></div>
<button class="btn" onclick="submitQuiz()">Submit</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
const questions = [
  { q:"Capital of France?", options:["Paris","Berlin","Rome"], answer:"Paris" },
  { q:"HTML stands for?", options:["Hyper Text Markup Language","Home Tool","High Text"], answer:"Hyper Text Markup Language" },
  { q:"2 + 2 = ?", options:["3","4","5"], answer:"4" }
];
function renderQuiz(){
  const box = document.getElementById('quizBox');
  box.innerHTML = questions.map((item,i)=>`
    <p><b>${i+1}. ${item.q}</b><br>
    ${item.options.map(o=>`<label><input type="radio" name="q${i}" value="${o}"> ${o}</label><br>`).join('')}
    </p>`).join('');
}
function submitQuiz(){
  let score = 0;
  questions.forEach((item,i)=>{
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if(selected && selected.value === item.answer) score++;
  });
  document.getElementById('output').textContent = `You scored ${score} out of ${questions.length}`;
}
renderQuiz();
</script>
</body>
</html>
