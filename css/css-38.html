.dropdown{position:relative;display:inline-block;}
.dropdown-content{display:none;position:absolute;background:#fff;border:1px solid #e5e7eb;min-width:140px;border-radius:6px;overflow:hidden;}
.dropdown-content a{display:block;padding:10px;color:#1f2333;text-decoration:none;}
.dropdown-content a:hover{background:#eef;}
.dropdown:hover .dropdown-content{display:block;}
</style>
</head>
