<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse a Number</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Reverse a Number</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Reverses the digits of a number.</p>
    <input id="n" type="number" value="12345"><button class="btn" onclick="run()">Reverse</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const n = document.getElementById('n').value;
  document.getElementById('output').textContent = "Reversed: " + n.split('').reverse().join('');
}
</script>
</body>
</html>
