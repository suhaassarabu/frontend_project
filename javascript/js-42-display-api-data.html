<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display API Data Dynamically</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Display API Data Dynamically</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Fetches and displays a list of API data dynamically.</p>
    <button class="btn" onclick="run()">Load Posts</button>
<ul id="apiList" class="program-list"></ul>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
async function run(){
  const list = document.getElementById('apiList');
  list.innerHTML = "Loading...";
  const res = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
  const data = await res.json();
  list.innerHTML = data.map(p => `<li>${p.title}</li>`).join('');
}
</script>
</body>
</html>
