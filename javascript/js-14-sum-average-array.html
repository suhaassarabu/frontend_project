<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sum and Average of Array</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Sum and Average of Array</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Finds the sum and average of array elements.</p>
    <input id="arr" value="10,20,30,40"><button class="btn" onclick="run()">Calculate</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const arr = document.getElementById('arr').value.split(',').map(Number);
  const sum = arr.reduce((a,b)=>a+b,0);
  document.getElementById('output').textContent = `Sum: ${sum}, Average: ${(sum/arr.length).toFixed(2)}`;
}
</script>
</body>
</html>
