<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positive, Negative, or Zero</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Positive, Negative, or Zero</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Checks whether a number is positive, negative, or zero.</p>
    <input id="n" type="number" value="-5"><button class="btn" onclick="run()">Check</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const n = Number(document.getElementById('n').value);
  let result = n > 0 ? "Positive" : (n < 0 ? "Negative" : "Zero");
  document.getElementById('output').textContent = n + " is " + result;
}
</script>
</body>
</html>
