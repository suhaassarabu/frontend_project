<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard-Controlled Game</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Keyboard-Controlled Game</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Move a box on screen using arrow keys.</p>
<div id="gameArea" style="position:relative;height:200px;background:#0f172a;border-radius:8px;overflow:hidden;">
<div id="player" style="position:absolute;top:80px;left:10px;width:30px;height:30px;background:#22c55e;border-radius:4px;"></div>
</div>
<p>Use arrow keys to move.</p>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
let x = 10, y = 80;
document.addEventListener('keydown', e=>{
  const step = 10;
  if(e.key === 'ArrowRight') x += step;
  if(e.key === 'ArrowLeft') x -= step;
  if(e.key === 'ArrowUp') y -= step;
  if(e.key === 'ArrowDown') y += step;
  x = Math.max(0, Math.min(270, x));
  y = Math.max(0, Math.min(170, y));
  const p = document.getElementById('player');
  p.style.left = x + "px";
  p.style.top = y + "px";
});
</script>
</body>
</html>
