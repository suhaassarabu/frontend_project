<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Count Words in a String</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Count Words in a String</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Counts the number of words in a string.</p>
    <textarea id="s" rows="3">The quick brown fox jumps over the lazy dog</textarea>
<button class="btn" onclick="run()">Count Words</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const s = document.getElementById('s').value.trim();
  const words = s.length ? s.split(/\s+/) : [];
  document.getElementById('output').textContent = "Word count: " + words.length;
}
</script>
</body>
</html>
