<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode with CSS Variables</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
:root{ --bg2:#fff; --fg2:#1f2333; }
body.dark{ --bg2:#1f2333; --fg2:#fff; }
.theme-box{background:var(--bg2);color:var(--fg2);padding:20px;margin-top:10px;
  border:1px solid #ccc;border-radius:8px;transition:all 0.3s;}
</style>
</head>
<body>
<header class="site-header">
  <h1>Dark Mode with CSS Variables</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">A dark-mode toggle using CSS variables.</p>
    
<button class="btn" onclick="document.body.classList.toggle('dark')">Toggle Dark Mode</button>
<div class="theme-box">This box adapts to the selected theme.</div>

  </div>
</main>
<footer class="page-nav">

</html>
