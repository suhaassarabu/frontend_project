<style>
.slide-track{overflow:hidden;width:100%;}
.slide-card{width:150px;padding:20px;background:#4f46e5;color:#fff;text-align:center;
  border-radius:8px;animation:slidein 2s ease forwards;}
@keyframes slidein{ from{transform:translateX(-200%);} to{transform:translateX(0);} }
</style>
</head>
