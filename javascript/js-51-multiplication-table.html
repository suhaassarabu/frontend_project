<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplication Table</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Multiplication Table</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Generates the multiplication table of a given number.</p>
    <input id="n" type="number" value="7"><button class="btn" onclick="run()">Generate</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const n = Number(document.getElementById('n').value);
  let rows = [];
  for(let i=1;i<=10;i++) rows.push(`${n} x ${i} = ${n*i}`);
  document.getElementById('output').innerHTML = rows.join('<br>');
}
</script>
</body>
</html>
