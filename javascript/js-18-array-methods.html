<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Array Methods</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Array Methods</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrates common array methods (map, filter, reduce).</p>
    <button class="btn" onclick="run()">Run</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const nums = [1,2,3,4,5,6];
  const doubled = nums.map(n=>n*2);
  const evens = nums.filter(n=>n%2===0);
  const total = nums.reduce((a,b)=>a+b,0);
  document.getElementById('output').innerHTML = `map: ${doubled}<br>filter(even): ${evens}<br>reduce(sum): ${total}`;
}
</script>
</body>
</html>
