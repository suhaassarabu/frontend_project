<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Events</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Form Events</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrate submit, change, focus, and blur form events.</p>
<form id="evtForm" onsubmit="return handleSubmit(event)">
<input id="evtField" placeholder="Focus / type here" onfocus="log('focus')" onblur="log('blur')" onchange="log('change')">
<button class="btn" type="submit">Submit</button>
</form>
<div id="formEvtOut" class="output-area" style="margin-top:10px;"></div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function log(msg){ document.getElementById('formEvtOut').textContent = "Event: " + msg; }
function handleSubmit(e){ e.preventDefault(); log('submit'); return false; }
</script>
</body>
</html>
