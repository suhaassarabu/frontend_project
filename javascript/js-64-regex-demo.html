<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regular Expressions Demo</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Regular Expressions Demo</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrates basic regular expressions in JavaScript.</p>
    <input id="s" value="Order 12 items for $45.99">
<button class="btn" onclick="run()">Extract Numbers</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const s = document.getElementById('s').value;
  const numbers = s.match(/\d+(\.\d+)?/g);
  document.getElementById('output').textContent = "Numbers found: " + (numbers ? numbers.join(", ") : "none");
}
</script>
</body>
</html>
