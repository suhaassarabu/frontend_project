<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>To-Do List</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">A working to-do list application.</p>
    <input id="todoInput" placeholder="Add a task">
<button class="btn" onclick="addTodo()">Add</button>
<ul id="todoList" class="program-list" style="margin-top:12px;"></ul>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function addTodo(){
  const input = document.getElementById('todoInput');
  if(!input.value.trim()) return;
  const li = document.createElement('li');
  li.textContent = input.value;
  const del = document.createElement('button');
  del.textContent = "Delete";
  del.className = "btn";
  del.style.marginLeft = "10px";
  del.onclick = () => li.remove();
  li.appendChild(del);
  document.getElementById('todoList').appendChild(li);
  input.value = "";
}
</script>
</body>
</html>
