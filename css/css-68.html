<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS-only Modal/Popup</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
  align-items:center;justify-content:center;}
#modal-toggle:checked ~ .modal-overlay{display:flex;}
.modal-box{background:#fff;padding:24px;border-radius:10px;text-align:center;}
</style>
</head>
<body>
<header class="site-header">
  <h1>CSS-only Modal/Popup</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">A modal/popup design using only HTML and CSS.</p>
    
<label for="modal-toggle" class="btn">Open Modal</label>
<input type="checkbox" id="modal-toggle" style="display:none;">
<div class="modal-overlay">
  <div class="modal-box">
    <h3>Modal Title</h3><p>This is a CSS-only modal popup.</p>
    <label for="modal-toggle" class="btn">Close</label>
  </div>
</div>

  </div>
</main>
<footer class="page-nav">
