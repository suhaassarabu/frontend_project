<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arithmetic Operations</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Arithmetic Operations</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Performs basic arithmetic operations on two numbers.</p>
    <input id="a" type="number" value="12"> <input id="b" type="number" value="5">
<button class="btn" onclick="run()">Calculate</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const a = Number(document.getElementById('a').value);
  const b = Number(document.getElementById('b').value);
  document.getElementById('output').innerHTML =
    `Sum: ${a+b}<br>Difference: ${a-b}<br>Product: ${a*b}<br>Quotient: ${(a/b).toFixed(2)}<br>Remainder: ${a%b}`;
}
</script>
</body>
</html>
