<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Tooltip</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.tooltip-wrap{position:relative;display:inline-block;border-bottom:1px dotted #4f46e5;cursor:pointer;}
.tooltip-text{visibility:hidden;background:#1f2333;color:#fff;padding:6px 10px;border-radius:6px;
  position:absolute;bottom:125%;left:0;white-space:nowrap;opacity:0;transition:opacity 0.3s;}
.tooltip-wrap:hover .tooltip-text{visibility:visible;opacity:1;}
</style>
</head>
<body>
<header class="site-header">
  <h1>CSS Tooltip</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">A tooltip created using pure CSS.</p>
    
<div class="tooltip-wrap">Hover over me
  <span class="tooltip-text">This is a tooltip!</span>
</div>

  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>

</body>
</html>
