<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power of a Number</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Power of a Number</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Calculates the power of a number.</p>
    <input id="base" type="number" value="2"><input id="exp" type="number" value="10">
<button class="btn" onclick="run()">Calculate</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const base = Number(document.getElementById('base').value), exp = Number(document.getElementById('exp').value);
  document.getElementById('output').textContent = `${base}^${exp} = ${Math.pow(base,exp)}`;
}
</script>
</body>
</html>
