<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double-Click Event</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Double-Click Event</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Respond to double-click events on a webpage.</p>
<div id="dblBox" style="padding:30px;background:#3b82f6;color:#fff;border-radius:8px;text-align:center;">Double-click me</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
document.getElementById('dblBox').addEventListener('dblclick', function(){
  this.style.background = this.style.background === "rgb(34, 197, 94)" ? "#3b82f6" : "#22c55e";
  this.textContent = "Double-clicked!";
});
</script>
</body>
</html>
