<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Page</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .profile-card {
    max-width: 360px;
    margin: 0 auto;
    text-align: center;
    background: linear-gradient(135deg, #f8fafc, #eef2ff);
    border: 1px solid #dbeafe;
    border-radius: 20px;
    padding: 26px 22px;
    box-shadow: 0 14px 28px rgba(79, 70, 229, 0.12);
  }

  .profile-card img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #c7d2fe;
    margin-bottom: 18px;
  }

  .profile-card h3 {
    margin: 0 0 8px;
    font-size: 1.8rem;
    color: #1f2937;
  }

  .profile-card .role {
    margin: 0 0 14px;
    color: #4f46e5;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.8rem;
  }

  .profile-card .info {
    margin: 0;
    color: #374151;
    line-height: 1.7;
    font-size: 1rem;
  }

  .skills {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .skills span {
    background: #4f46e5;
    color: #fff;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 600;
  }
</style>
</head>
<body>
<header class="site-header">
  <h1>Student Profile Page</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">A college/student profile page using HTML and CSS.</p>

    <div class="profile-card">
      <img src="https://static.vecteezy.com/system/resources/thumbnails/045/647/947/small/3d-character-people-close-up-portrait-smiling-nice-3d-avartar-or-icon-free-png.png" alt="student profile photo">
      <h3>Suhaas Sarabu</h3>
      <p class="role">Student</p>
      <p class="info">Studying at SAI University, Chennai<br>2nd Year - SCDS</p>

      <div class="skills">
        <span>C Language</span>
        <span>Python</span>
        <span>DSA</span>
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
      </div>
    </div>

  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>

</script>
</body>
</html>
