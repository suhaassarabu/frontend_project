  <div class="program-box">
    <p class="description">Demonstrates email, date, number, and password inputs.</p>
    
<form onsubmit="return false;">
  <p><label>Email: <input type="email"></label></p>
  <p><label>Date of Birth: <input type="date"></label></p>
  <p><label>Age: <input type="number" min="1" max="100"></label></p>
  <p><label>Password: <input type="password"></label></p>
  <p><label>Range: <input type="range" min="0" max="10"></label></p>
  <p><label>Color: <input type="color"></label></p>
</form>
