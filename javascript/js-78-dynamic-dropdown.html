<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Dropdown List</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Dynamic Dropdown List</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Populate a dropdown list dynamically using JavaScript.</p>
<button class="btn" onclick="fillDropdown()">Load Options</button>
<select id="dynDropdown" style="margin-top:10px;"></select>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function fillDropdown(){
  const fruits = ["Apple","Banana","Mango","Orange","Grapes"];
  const select = document.getElementById('dynDropdown');
  select.innerHTML = "";
  fruits.forEach(f=>{
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    select.appendChild(opt);
  });
}
</script>
</body>
</html>
