<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Largest of Three Numbers</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Largest of Three Numbers</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Finds the largest of three numbers.</p>
    <input id="a" type="number" value="4"> <input id="b" type="number" value="9"> <input id="c" type="number" value="7">
<button class="btn" onclick="run()">Find Largest</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const a=Number(document.getElementById('a').value), b=Number(document.getElementById('b').value), c=Number(document.getElementById('c').value);
  const largest = Math.max(a,b,c);
  document.getElementById('output').textContent = "Largest number is: " + largest;
}
</script>
</body>
</html>
