<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>BMI Calculator</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Calculate Body Mass Index from height and weight.</p>
<input id="bmiHeight" type="number" placeholder="Height (cm)">
<input id="bmiWeight" type="number" placeholder="Weight (kg)">
<button class="btn" onclick="calcBMI()">Calculate BMI</button>
<p id="bmiOut"></p>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function calcBMI(){
  const h = parseFloat(document.getElementById('bmiHeight').value) / 100;
  const w = parseFloat(document.getElementById('bmiWeight').value);
  const out = document.getElementById('bmiOut');
  if(!h || !w){ out.textContent = "Enter valid height and weight."; return; }
  const bmi = (w / (h*h)).toFixed(1);
  let category;
  if(bmi < 18.5) category = "Underweight";
  else if(bmi < 25) category = "Normal";
  else if(bmi < 30) category = "Overweight";
  else category = "Obese";
  out.textContent = "BMI: " + bmi + " (" + category + ")";
}
</script>
</body>
</html>
