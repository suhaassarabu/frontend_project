<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inheritance in JavaScript</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Inheritance in JavaScript</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrates class inheritance using extends and super.</p>
    <button class="btn" onclick="run()">Run</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
class Animal{
  constructor(name){ this.name = name; }
  speak(){ return `${this.name} makes a sound.`; }
}
class Dog extends Animal{
  speak(){ return `${this.name} barks. (${super.speak()})`; }
}
function run(){
  const d = new Dog("Rex");
  document.getElementById('output').textContent = d.speak();
}
</script>
</body>
</html>
