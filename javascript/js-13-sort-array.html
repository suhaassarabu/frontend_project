<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort an Array</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Sort an Array</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Sorts an array of numbers in ascending order.</p>
    <input id="arr" value="5,2,8,1,9"><button class="btn" onclick="run()">Sort</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const arr = document.getElementById('arr').value.split(',').map(Number).sort((a,b)=>a-b);
  document.getElementById('output').textContent = "Sorted: " + arr.join(", ");
}
</script>
</body>
</html>
