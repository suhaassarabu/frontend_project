<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form Validation</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Student Registration Form Validation</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Validate a student registration form with JavaScript.</p>
<form id="regForm" onsubmit="return validateReg(event)" class="reg-form">
<input id="regName" placeholder="Full Name"><br>
<input id="regEmail" placeholder="Email"><br>
<input id="regRoll" placeholder="Roll Number"><br>
<button class="btn" type="submit">Register</button>
</form>
<div id="regOut" class="output-area"></div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function validateReg(e){
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const roll = document.getElementById('regRoll').value.trim();
  const out = document.getElementById('regOut');
  if(!name || !email || !roll){ out.textContent = "All fields are required."; return false; }
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){ out.textContent = "Invalid email address."; return false; }
  out.textContent = "Registration successful for " + name + "!";
  return false;
}
</script>
</body>
</html>
