<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Count Vowels and Consonants</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Count Vowels and Consonants</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Counts vowels and consonants in a string.</p>
    <input id="s" value="Hello World"><button class="btn" onclick="run()">Count</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const s = document.getElementById('s').value.toLowerCase();
  let vowels = 0, consonants = 0;
  for(const ch of s){
    if(/[a-z]/.test(ch)){ "aeiou".includes(ch) ? vowels++ : consonants++; }
  }
  document.getElementById('output').textContent = `Vowels: ${vowels}, Consonants: ${consonants}`;
}
</script>
</body>
</html>
