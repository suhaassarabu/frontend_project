<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armstrong Number Check</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Armstrong Number Check</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Checks whether a number is an Armstrong number.</p>
    <input id="n" type="number" value="153"><button class="btn" onclick="run()">Check</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const n = document.getElementById('n').value;
  const digits = n.split('');
  const power = digits.length;
  const sum = digits.reduce((s,d)=>s + Math.pow(Number(d), power), 0);
  document.getElementById('output').textContent = n + (sum == n ? " is an Armstrong number" : " is Not an Armstrong number");
}
</script>
</body>
</html>
