<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grade Calculator</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Student Grade Calculator</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Calculate grade based on entered marks.</p>
<input id="gradeMarks" type="number" placeholder="Enter marks (0-100)">
<button class="btn" onclick="calcGrade()">Calculate Grade</button>
<p id="gradeOut"></p>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function calcGrade(){
  const marks = parseFloat(document.getElementById('gradeMarks').value);
  const out = document.getElementById('gradeOut');
  if(isNaN(marks) || marks < 0 || marks > 100){ out.textContent = "Enter valid marks (0-100)."; return; }
  let grade;
  if(marks >= 90) grade = "A+";
  else if(marks >= 80) grade = "A";
  else if(marks >= 70) grade = "B";
  else if(marks >= 60) grade = "C";
  else if(marks >= 40) grade = "D";
  else grade = "Fail";
  out.textContent = "Grade: " + grade;
}
</script>
</body>
</html>
