<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date and Math Objects</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Date and Math Objects</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrates the built-in Date and Math objects.</p>
    <button class="btn" onclick="run()">Run</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const now = new Date();
  document.getElementById('output').innerHTML = `Today: ${now.toDateString()}<br>
    Math.PI: ${Math.PI.toFixed(4)}<br>Math.sqrt(81): ${Math.sqrt(81)}<br>Math.random(): ${Math.random().toFixed(3)}`;
}
</script>
</body>
</html>
