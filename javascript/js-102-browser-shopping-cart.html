<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart using localStorage</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Shopping Cart using localStorage</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Build a small shopping cart that persists using localStorage.</p>
<button class="btn" onclick="addToCart()">Add Item to Cart</button>
<button class="btn" onclick="clearCart()">Clear Cart</button>
<ul id="cartList" class="program-list" style="margin-top:12px;"></ul>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function getCart(){ return JSON.parse(localStorage.getItem('cart') || '[]'); }
function renderCart(){
  const cart = getCart();
  document.getElementById('cartList').innerHTML = cart.map(i=>"<li>"+i+"</li>").join("");
}
function addToCart(){
  const cart = getCart();
  cart.push("Item " + (cart.length + 1));
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}
function clearCart(){ localStorage.removeItem('cart'); renderCart(); }
renderCart();
</script>
</body>
</html>
