<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>querySelector & querySelectorAll</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>querySelector & querySelectorAll</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Select elements using querySelector and querySelectorAll.</p>
<p class="qItem">Query 1</p><p class="qItem">Query 2</p><p class="qItem">Query 3</p>
<button class="btn" onclick="run()">Run Query</button>
<div id="out2" class="output-area"></div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function run(){
  const first = document.querySelector('.qItem');
  const all = document.querySelectorAll('.qItem');
  document.getElementById('out2').innerHTML =
    "First match: " + first.textContent + "<br>Total matches: " + all.length;
}
</script>
</body>
</html>
