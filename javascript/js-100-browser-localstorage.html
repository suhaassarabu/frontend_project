<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>localStorage Demo</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>localStorage Demo</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Store and retrieve data using localStorage.</p>
<input id="lsInput" placeholder="Enter a note">
<button class="btn" onclick="saveLS()">Save</button>
<button class="btn" onclick="loadLS()">Load</button>
<div id="lsOut" class="output-area"></div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function saveLS(){
  localStorage.setItem('note', document.getElementById('lsInput').value);
  document.getElementById('lsOut').textContent = "Saved to localStorage.";
}
function loadLS(){
  document.getElementById('lsOut').textContent = "Stored value: " + (localStorage.getItem('note') || "(none)");
}
</script>
</body>
</html>
