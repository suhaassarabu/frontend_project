<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate Name, Email, Phone, Password</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Validate Name, Email, Phone, Password</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Validates name, email, phone number, and password fields.</p>
    <form onsubmit="return validateAll()">
  <p><input id="v_name" placeholder="Name"></p>
  <p><input id="v_email" placeholder="Email"></p>
  <p><input id="v_phone" placeholder="Phone (10 digits)"></p>
  <p><input id="v_pass" type="password" placeholder="Password (min 6 chars)"></p>
  <button class="btn" type="submit">Validate</button>
</form><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function validateAll(){
  const name = document.getElementById('v_name').value.trim();
  const email = document.getElementById('v_email').value.trim();
  const phone = document.getElementById('v_phone').value.trim();
  const pass = document.getElementById('v_pass').value;
  const out = document.getElementById('output');
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const phoneRe = /^\d{10}$/;
  if(!name){ out.textContent = "Name required."; return false; }
  if(!emailRe.test(email)){ out.textContent = "Invalid email."; return false; }
  if(!phoneRe.test(phone)){ out.textContent = "Phone must be 10 digits."; return false; }
  if(pass.length < 6){ out.textContent = "Password must be at least 6 characters."; return false; }
  out.textContent = "All fields are valid!";
  return false;
}
</script>
</body>
</html>
