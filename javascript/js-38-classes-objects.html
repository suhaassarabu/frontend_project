<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes and Objects</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Classes and Objects</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrates ES6 classes and objects.</p>
    <button class="btn" onclick="run()">Run</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
class Person{
  constructor(name, age){ this.name = name; this.age = age; }
  intro(){ return `I am ${this.name}, ${this.age} years old.`; }
}
function run(){
  const p = new Person("Meera", 21);
  document.getElementById('output').textContent = p.intro();
}
</script>
</body>
