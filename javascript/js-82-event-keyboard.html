<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Events</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Keyboard Events</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrate keydown, keyup, and keypress events.</p>
<input id="keyInput" placeholder="Type here...">
<div id="keyOut" class="output-area" style="margin-top:10px;"></div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
const input = document.getElementById('keyInput');
input.addEventListener('keydown', e=>{
  document.getElementById('keyOut').textContent = "Key down: " + e.key;
});
</script>
</body>
</html>
