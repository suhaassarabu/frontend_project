<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCD of Two Numbers</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>GCD of Two Numbers</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Finds the greatest common divisor of two numbers.</p>
    <input id="a" type="number" value="24"><input id="b" type="number" value="36">
<button class="btn" onclick="run()">Find GCD</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function gcd(a,b){ return b === 0 ? a : gcd(b, a % b); }
function run(){
  const a = Number(document.getElementById('a').value), b = Number(document.getElementById('b').value);
  document.getElementById('output').textContent = "GCD: " + gcd(a,b);
}
</script>
</body>
</html>
