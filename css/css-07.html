<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Positioning</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.container{position:relative;height:120px;border:1px solid #ccc;}
.relbox{position:relative;top:10px;left:10px;background:#16a34a;color:#fff;padding:6px;display:inline-block;}
.absbox{position:absolute;bottom:10px;right:10px;background:#dc2626;color:#fff;padding:6px;}
.sticky{position:sticky;top:0;background:#fbbf24;padding:6px;}
.fixed{position:fixed;bottom:10px;right:10px;background:#4f46e5;color:#fff;padding:6px;border-radius:6px;}
</style>
</head>
<body>
<header class="site-header">
  <h1>CSS Positioning</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Static, relative, absolute, fixed, and sticky positioning.</p>
    
<div class="container">
  <div class="relbox">Relative</div>
  <div class="absbox">Absolute</div>
</div>
<div class="sticky">Sticky (scroll to test)</div>
<div style="height:600px;">Scroll down...</div>
<div class="fixed">Fixed</div>

  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>

</script>
</body>
</html>
