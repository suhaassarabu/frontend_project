<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter with Increment/Decrement</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Counter with Increment/Decrement</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">A counter application with increment and decrement buttons.</p>
    <div class="output-area" id="counterVal" style="font-size:1.5rem;">0</div>
<button class="btn" onclick="change(1)">+</button>
<button class="btn" onclick="change(-1)">-</button>
<button class="btn" onclick="reset()">Reset</button>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
let count = 0;
function render(){ document.getElementById('counterVal').textContent = count; }
function change(n){ count += n; render(); }
function reset(){ count = 0; render(); }
</script>
</body>
</html>
