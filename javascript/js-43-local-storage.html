<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store and Retrieve Data using localStorage</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header class="site-header">
  <h1>Store and Retrieve Data using localStorage</h1>
  <span class="author-chip">by <strong>Suhaas Sarabu</strong></span>
</header>
<nav class="crumbs">
  <a href="../index.html">Home</a>
  <a href="index.html">Back to Programs</a>
</nav>
<main>
  <div class="program-box">
    <p class="description">Demonstrates saving and retrieving data with localStorage.</p>
    <input id="lsInput" placeholder="Enter a note">
<button class="btn" onclick="save()">Save</button>
<button class="btn" onclick="load()">Load</button>
<button class="btn" onclick="clearLS()">Clear</button><div class="output-area" id="output">Output will appear here.</div>
  </div>
</main>
<footer class="page-nav">
  <a class="btn" href="../index.html">Home</a>
  <a class="btn" href="index.html">Back to Programs</a>
</footer>
<script>
function save(){
  localStorage.setItem('myNote', document.getElementById('lsInput').value);
  document.getElementById('output').textContent = "Saved to localStorage!";
}
function load(){
  const val = localStorage.getItem('myNote');
  document.getElementById('output').textContent = val ? "Loaded: " + val : "No data saved yet.";
}
function clearLS(){ localStorage.removeItem('myNote'); document.getElementById('output').textContent = "Cleared."; }
</script>
</body>
</html>
